monitor=,preferred,auto,1

env = XCURSOR_SIZE,24

# Execute at launch
exec-once = quickshell & hyprpaper & wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store & udiskie &

input {
    kb_layout = us, ua
    kb_options = grp:alt_shift_toggle, caps:swapescape
    touchpad:natural_scroll = yes
    sensitivity = -0.5
    accel_profile = flat
    follow_mouse = 2
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(f4f4f4cc)
    col.inactive_border = rgba(666666cc)
    layout = master
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        popups = true
    }
    shadow:enabled = false
}

animations {
    enabled = true
    bezier = ease_in_out, 0.5, 0, 0.5, 1
    bezier = ease_in, 0.5, 0, 1, 1
    bezier = ease_out, 0, 0, 0.5, 1
    animation = global, 1, 3, ease_in_out
    animation = windowsIn, 1, 3, ease_out
    animation = windowsOut, 1, 3, ease_in
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

master:mfact = 0.5

# Rules
windowrule = match:class (kitty|firefox|zen), opacity 0.8
windowrule = match:title .*(YouTube|.png|.jpg|.jpeg|.webp|.webm|.mp4|.gif).*, opacity 1
layerrule {
  name = quickshell
  match:namespace = quickshell
  no_anim = true
  blur = true
  ignore_alpha = 0
}
windowrule = match:class Sxiv, tag +image-viewer
windowrule {
  name = float-image-viewer
  match:tag = image-viewer
  float = true
  center = true
}
windowrule = match:class mpv, tag +video-player
windowrule = match:initial_title VLC media player, tag +video-player
windowrule {
  name = float-video-player
  match:tag = video-player
  float = true
  center = true
  size = 1280 720
}

$mainMod = SUPER

# Programs
bind = $mainMod, Return, exec, kitty
bind = $mainMod, E, exec, kitty yazi
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, N, exec, qs ipc call quickSettings toggle

# Powermenu and Lock Screen
bind = $mainMod, X, exec, qs ipc call lockScreen lock
bind = $mainMod Shift, X, exec, qs ipc call powerMenu toggle
bind = $mainMod, T, exec, sh ~/.config/rofi/tools.sh

#Clipboard
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p "Clipboard:"| cliphist decode | wl-copy

# Screenshots
bind = , Print, exec, grim && mv ~/*_grim.png ~/Pictures/Screenshots/
bind = $mainMod, Print, exec, grim - | wl-copy
bind = $mainMod Shift, Print, exec, grim -g "$(slurp)" && mv ~/*_grim.png ~/Pictures/Screenshots/

#Music
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

#Volume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

#Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

#Hyprland Actions
bind = $mainMod, W, killactive 
bind = $mainMod, S, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, A, fullscreen, 1

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move/resize windows with keyboard
bind = $mainMod Shift, H, movewindow, l
bind = $mainMod Shift, J, movewindow, d
bind = $mainMod Shift, K, movewindow, u
bind = $mainMod Shift, L, movewindow, r

bind = $mainMod, left, resizeactive, -50 0
bind = $mainMod, down, resizeactive, 0 50
bind = $mainMod, up, resizeactive, 0 -50
bind = $mainMod, right, resizeactive, 50 0

#Extra
exec-once = sleep 5 && obs --startreplaybuffer --minimize-to-tray & com.github.wwmm.easyeffects -w &

bind = CTRL_SHIFT, escape, exec, kitty btop
bind = $mainMod, Y, exec, obs-cli replay save && notify-send "OBS" "Replay saved" -i ~/.config/hypr/assets/file-video-solid.png
bind = $mainMod, I, exec, obs-cli record toggle && notify-send "OBS" "Record toggled" -i ~/.config/hypr/assets/file-video-solid.png

bind = $mainMod, U, exec, qs ipc call appLauncher toggle

windowrule = match:class Waydroid, fullscreen true
