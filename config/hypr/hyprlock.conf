background {
    path = screenshot
    blur_size = 3
    blur_passes = 3
    brightness = 0.7
}
input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgb(235, 188, 186)
    inner_color = rgb(144, 140, 170)
    font_color = rgb(224, 222, 244)
    placeholder_text = <i>Input Password...</i>
    fade_on_empty = false
    check_color = rgb(246, 193, 119)
    fail_color = rgb(235, 111, 146)
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(224, 222, 244, 0.8)
    font_size = 50
    font_family = Noto Sans

    position = 0, 200
    halign = center
    valign = center
}
